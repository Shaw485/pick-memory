name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        default: "v0.3.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: |
          node --check background.js
          node --check content.js
          node tests/scheduler.test.js
          node tests/background.test.js
          ./native-macos/build.sh
          python3 native-macos/tests/test_native_host.py

      - name: Build macOS and Windows packages
        run: node packaging/build-release.mjs

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" \
            dist/Pick-Memory-macOS-*.zip \
            dist/Pick-Memory-Windows-*.zip \
            dist/SHA256SUMS.txt \
            --title "Pick Memory ${RELEASE_TAG}" \
            --generate-notes
